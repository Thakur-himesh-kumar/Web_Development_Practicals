<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create & Manipulate DOM Elements</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background-color: #f2f2f2;
        }
        ul {
            background: white;
            padding: 15px;
            border-radius: 6px;
        }
        li {
            margin: 5px 0;
        }
        button {
            margin-right: 5px;
            padding: 6px 10px;
        }
    </style>
</head>
<body>

<h2>DOM Create, Append, Remove & Modify</h2>

<ul id="list">
    <li>Item 1</li>
    <li>Item 2</li>
</ul>

<button onclick="addItem()">Add Item</button>
<button onclick="removeItem()">Remove Last Item</button>
<button onclick="modifyItem()">Modify First Item</button>

<script>
    const list = document.getElementById("list");
    let count = 3;

    // CREATE & APPEND child node
    function addItem() {
        const li = document.createElement("li");   // create element
        li.textContent = "Item " + count;           // add text
        list.appendChild(li);                       // append child
        count++;
    }

    // REMOVE child node
    function removeItem() {
        if (list.children.length > 0) {
            list.removeChild(list.lastElementChild);
        }
    }

    // MODIFY child node
    function modifyItem() {
        if (list.children.length > 0) {
            list.firstElementChild.innerHTML = "Modified Item";
            list.firstElementChild.style.color = "red";
        }
    }
</script>

</body>
</html>
